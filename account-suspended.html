<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Suspended</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #333;
    }

    .box {
      max-width: 600px;
      margin: 120px auto;
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      color: #c0392b;
      margin-bottom: 15px;
    }

    .code {
      background: #eee;
      padding: 10px;
      margin: 15px 0;
      font-family: monospace;
      border-radius: 4px;
    }

    .small {
      color: #777;
      font-size: 0.9em;
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
      border: none;
      background: #3498db;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Account Suspended</h1>
    <p>This website has been temporarily disabled due to non-payment of hosting fees.</p>

    <div class="code">
      Error Code: HOST-402<br>
      Status: Billing Overdue
    </div>

    <p>Please contact your hosting provider to restore service.</p>
    <p class="small">If you believe this is an error, open a support ticket.</p>

  </div>

</body>
</html>
